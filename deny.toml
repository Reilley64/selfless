[graph]
exclude-dev = true

[bans]
multiple-versions = "allow"
wildcards = "allow"
deny = [
    { name = "native-tls" },

    { name = "domain", wrappers = ["selfless", "application", "ffmpeg", "media-folder", "persistence", "radarr", "sonarr", "api", "webhooks", "workers"] },
    { name = "application", wrappers = ["selfless", "infrastructure", "email", "ffmpeg", "images", "locking", "media-folder", "persistence", "radarr", "servarr", "sonarr", "telemetry", "api", "admin", "webhooks", "workers"] },

    { name = "email", wrappers = ["selfless", "settings"] },
    { name = "ffmpeg", wrappers = ["selfless", "settings"] },
    { name = "images", wrappers = ["selfless", "settings"] },
    { name = "locking", wrappers = ["selfless"] },
    { name = "media-folder", wrappers = ["selfless"] },
    { name = "persistence", wrappers = ["selfless", "settings", "workers"] },
    { name = "radarr", wrappers = ["selfless", "settings"] },
    { name = "sonarr", wrappers = ["selfless", "settings"] },
    { name = "servarr", wrappers = ["selfless", "radarr", "sonarr"] },
    { name = "telemetry", wrappers = ["selfless", "settings"] },
    { name = "settings", wrappers = ["selfless"] },
    { name = "infrastructure", wrappers = ["selfless", "api", "admin", "webhooks", "workers"] },

    { name = "admin", wrappers = ["selfless"] },
    { name = "api", wrappers = ["selfless"] },
    { name = "webhooks", wrappers = ["selfless"] },
    { name = "workers", wrappers = ["selfless"] },

    { name = "test-fixtures" },
    { name = "test-app" },
]
