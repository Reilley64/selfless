[bans]
multiple-versions = "allow"
wildcards = "allow"
deny = [
    { name = "native-tls" },

    { name = "domain", wrappers = ["selfless", "application", "api", "email"] },
    { name = "application", wrappers = ["selfless", "infrastructure", "email", "locking", "persistence", "telemetry", "api", "admin", "workers"] },

    { name = "email", wrappers = ["selfless", "settings"] },
    { name = "locking", wrappers = ["selfless"] },
    { name = "persistence", wrappers = ["selfless", "settings"] },
    { name = "telemetry", wrappers = ["selfless", "settings"] },
    { name = "settings", wrappers = ["selfless"] },
    { name = "infrastructure", wrappers = ["selfless", "api", "admin", "workers"] },

    { name = "admin", wrappers = ["selfless"] },
    { name = "api", wrappers = ["selfless"] },
    { name = "webhooks", wrappers = ["selfless"] },
    { name = "workers", wrappers = ["selfless"] },
]
