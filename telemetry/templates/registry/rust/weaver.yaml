whitespace_control:
  trim_blocks: true
  lstrip_blocks: true
templates:
  - template: attributes.rs.j2
    filter: '{attributes: [.groups[] | select(.type == "attribute_group") | .attributes[]] | sort_by(.name)}'
    application_mode: single
  - template: metrics.rs.j2
    filter: '{metrics: [.groups[] | select(.type == "metric")] | sort_by(.metric_name)}'
    application_mode: single
