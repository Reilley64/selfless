groups:
  - id: registry.selfless.playback
    type: attribute_group
    display_name: Playback attributes
    brief: Attributes of playbacks, from the play request to the player's events.
    attributes:
      - id: selfless.playback.method
        type:
          members:
            - id: direct_play
              value: directPlay
              brief: The device plays the media file as it is on disk.
              stability: development
            - id: remux
              value: remux
              brief: selfless copies the media file's video and audio into a format the device can open.
              stability: development
            - id: transcode
              value: transcode
              brief: selfless converts the video or audio into a format the device can play.
              stability: development
        stability: development
        brief: How the server chose to play a media file.
      - id: selfless.playback.reason_kind
        type:
          members:
            - id: container
              value: container
              brief: The media file's container.
              stability: development
            - id: video_codec
              value: videoCodec
              brief: The video codec.
              stability: development
            - id: video_profile
              value: videoProfile
              brief: The video profile.
              stability: development
            - id: video_level
              value: videoLevel
              brief: The video level.
              stability: development
            - id: video_size
              value: videoSize
              brief: The video width or height.
              stability: development
            - id: video_bit_depth
              value: videoBitDepth
              brief: The video bit depth.
              stability: development
            - id: video_range
              value: videoRange
              brief: The video's dynamic range.
              stability: development
            - id: audio_codec
              value: audioCodec
              brief: The codec of an audio track.
              stability: development
            - id: audio_channels
              value: audioChannels
              brief: The channels of an audio track.
              stability: development
            - id: subtitle
              value: subtitle
              brief: A subtitle the device can't show from the file.
              stability: development
            - id: no_keyframe_index
              value: noKeyframeIndex
              brief: The media file has no keyframe at least every 20 seconds.
              stability: development
            - id: forced_hls
              value: forcedHls
              brief: The play request forced HLS.
              stability: development
        stability: development
        brief: The kind of one reason a playback is not a direct play.
        note: Only selfless.playback.reason_kinds carries these values.
      - id: selfless.playback.reason_kinds
        type: string[]
        stability: development
        brief: The kinds of the reasons a playback is not a direct play, in the order the server found them.
        note: Each kind is a selfless.playback.reason_kind value. A direct play has none.
        examples: [["container", "audioCodec"]]
  - id: registry.selfless.media_file
    type: attribute_group
    display_name: Media file attributes
    brief: Attributes of the media file a movie or episode plays from.
    attributes:
      - id: selfless.media_file.id
        type: string
        stability: development
        brief: The ID of the media file.
        examples: ["01890a5d-ac96-774b-bcce-b302099a8057"]
  - id: registry.selfless.ffmpeg
    type: attribute_group
    display_name: ffmpeg attributes
    brief: Attributes of the ffmpeg processes that make the HLS segments of a playback.
    attributes:
      - id: selfless.ffmpeg.purpose
        type:
          members:
            - id: remux
              value: remux
              brief: ffmpeg copies the video and audio into HLS segments.
              stability: development
            - id: transcode
              value: transcode
              brief: ffmpeg converts the video or audio into HLS segments.
              stability: development
            - id: subtitle
              value: subtitle
              brief: ffmpeg converts a subtitle file beside the media file into WebVTT.
              stability: development
        stability: development
        brief: What an ffmpeg process makes.
      - id: selfless.ffmpeg.start_segment
        type: int
        stability: development
        brief: The index of the first HLS segment an ffmpeg process writes. A seek restarts ffmpeg at a later one.
        examples: [0, 240]
  - id: metric.selfless.playback.active
    type: metric
    metric_name: selfless.playback.active
    brief: Playbacks that have not ended.
    instrument: gauge
    unit: "{playback}"
    stability: development
    attributes:
      - ref: selfless.playback.method
        requirement_level: required
  - id: metric.selfless.playback.decisions
    type: metric
    metric_name: selfless.playback.decisions
    brief: Play requests that started a playback, by how the server chose to play the media file.
    instrument: counter
    unit: "{decision}"
    stability: development
    attributes:
      - ref: selfless.playback.method
        requirement_level: required
      - ref: selfless.auth.client_kind
        requirement_level: required
      - ref: selfless.playback.reason_kinds
        requirement_level:
          conditionally_required: When the playback is not a direct play.
  - id: span.selfless.playback
    type: span
    span_kind: internal
    brief: >
      A player's span for one moment of a playback. The first lasts from the play request until the playback
      starts, fails or stops. Each later one holds one event and is a child of the first.
    stability: development
    attributes:
      - ref: selfless.media_file.id
        requirement_level: required
  - id: span.selfless.ffmpeg
    type: span
    span_kind: internal
    brief: One ffmpeg process making the HLS segments of a playback, from its start until it exits or is stopped.
    stability: development
    attributes:
      - ref: selfless.ffmpeg.purpose
        requirement_level: required
      - ref: selfless.ffmpeg.start_segment
        requirement_level: required
  - id: event.selfless.playback.started
    type: event
    name: selfless.playback.started
    brief: The player started playing.
    stability: development
  - id: event.selfless.playback.paused
    type: event
    name: selfless.playback.paused
    brief: The player paused.
    stability: development
  - id: event.selfless.playback.seeked
    type: event
    name: selfless.playback.seeked
    brief: The player finished a seek.
    stability: development
  - id: event.selfless.playback.stopped
    type: event
    name: selfless.playback.stopped
    brief: The player stopped, because the user left it or the media file ended.
    stability: development
  - id: event.selfless.playback.failed
    type: event
    name: selfless.playback.failed
    brief: The play request failed or the player could not play the media file.
    stability: development
  - id: event.selfless.playback.switched
    type: event
    name: selfless.playback.switched
    brief: >
      The player started the media file again at the same position, through HLS after a direct play failed, or
      for an audio or subtitle track the stream it played could not switch to.
    note: After a failed direct play, error.type holds the player's error.
    stability: development
  - id: event.selfless.playback.still_watching_prompt
    type: event
    name: selfless.playback.still_watching_prompt
    brief: >
      The player asked "Are you still watching?" and loaded the next episode paused behind the prompt, because the
      episode that ended was the third autoplayed in a row.
    stability: development
