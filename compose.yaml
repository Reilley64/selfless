name: selfless

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: selfless
      POSTGRES_PASSWORD: selfless
      POSTGRES_DB: selfless
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "--username", "selfless"]
      interval: 2s
      timeout: 5s
      retries: 15

  otel-lgtm:
    image: grafana/otel-lgtm:0.38.1
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"

volumes:
  postgres:
