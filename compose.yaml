name: selfless

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: selfless
      POSTGRES_PASSWORD: selfless
      POSTGRES_DB: selfless
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "--username", "selfless"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres:
