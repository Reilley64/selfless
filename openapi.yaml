openapi: 3.1.1
info:
  title: selfless
  description: The HTTP API of the selfless media server, used by its web and TV apps.
  version: 0.1.0 # x-release-please-version
  license:
    name: MIT OR Apache-2.0
    identifier: MIT OR Apache-2.0
servers:
  - url: /
security:
  - sessionToken: []
paths:
  /actuator/health/v1:
    get:
      operationId: getHealth
      summary: Overall health with every component
      tags: [actuator]
      security: []
      responses:
        "200":
          description: Every component is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example: {"status":"UP","components":{"db":{"status":"UP"},"livenessState":{"status":"UP"},"readinessState":{"status":"UP"}}}
        "503":
          description: A component is down or out of service.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example: {"status":"DOWN","components":{"db":{"status":"DOWN"},"livenessState":{"status":"UP"},"readinessState":{"status":"UP"}}}
  /actuator/health/liveness/v1:
    get:
      operationId: getLiveness
      summary: Liveness group, which reports only the process's own state
      tags: [actuator]
      security: []
      responses:
        "200":
          description: The process is live.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessHealth"
              example: {"status":"UP","components":{"livenessState":{"status":"UP"}}}
        "503":
          description: The process is broken.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessHealth"
              example: {"status":"DOWN","components":{"livenessState":{"status":"DOWN"}}}
  /actuator/health/readiness/v1:
    get:
      operationId: getReadiness
      summary: Readiness group, which also checks PostgreSQL
      tags: [actuator]
      security: []
      responses:
        "200":
          description: The server accepts traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessHealth"
              example: {"status":"UP","components":{"db":{"status":"UP"},"readinessState":{"status":"UP"}}}
        "503":
          description: PostgreSQL is down or the server is shutting down.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessHealth"
              example: {"status":"OUT_OF_SERVICE","components":{"db":{"status":"UP"},"readinessState":{"status":"OUT_OF_SERVICE"}}}
  /actuator/info/v1:
    get:
      operationId: getInfo
      summary: Build and git information of the running server
      tags: [actuator]
      security: []
      responses:
        "200":
          description: The build and git information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Info"
              example: {"build":{"name":"selfless","version":"0.1.0"},"git":{"branch":"main","commit":{"id":"56ad9034","time":"2026-10-29T06:12:00Z"}}}
  /api/sessions/v1:
    post:
      operationId: signIn
      summary: Sign a user in with their name and password
      description: Starts a session on the client and returns its token. Names ignore case.
      tags: [sessions]
      security: []
      requestBody:
        description: The user's name and password, and the client they sign in on.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
            example: {"name":"Noor","password":"a long passphrase about tea","clientKind":"web","deviceName":"Firefox on macOS","clientId":"0f8e3c2a-5b7d-4e19-9a64-2c1d8b7f6e30"}
      responses:
        "201":
          description: The user is signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedIn"
              example: {"token":"q2Xz8kQ0mJ3Hc1yF5bR7tVw9nL4pA6sD0eG2iK8uO1M","user":{"id":"01890a5d-ac96-774b-bcce-b302099a8057","name":"Noor","colour":"amber"}}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/WrongNameOrPassword"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/sessions/current/v1:
    delete:
      operationId: signOut
      summary: Sign out the session whose token made the call
      tags: [sessions]
      responses:
        "204":
          description: The session has ended, and its token no longer works.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/me/v1:
    get:
      operationId: getMe
      summary: The signed-in user
      tags: [users]
      responses:
        "200":
          description: The user whose token made the call.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              example: {"id":"01890a5d-ac96-774b-bcce-b302099a8057","name":"Noor","colour":"amber"}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/me/password/v1:
    put:
      operationId: changePassword
      summary: Change the signed-in user's password
      description: Ends every other session of the user, on the web and on TVs. The session that made the call stays signed in.
      tags: [users]
      requestBody:
        description: The current password and the new one.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
            example: {"currentPassword":"a long passphrase about tea","newPassword":"a longer passphrase about coffee"}
      responses:
        "204":
          description: The password has changed, and the user's other sessions have ended.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/WrongCurrentPassword"
        "422":
          $ref: "#/components/responses/EmptyPassword"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/me/playback-settings/v1:
    get:
      operationId: getPlaybackSettings
      summary: The signed-in user's playback settings
      tags: [users]
      responses:
        "200":
          description: The user's playback settings, the same on every device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackSettings"
              example: {"autoplayNextEpisode":true,"askIfStillWatching":false}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: changePlaybackSettings
      summary: Change the signed-in user's playback settings
      description: The audio and subtitle languages playback remembers are not changed here. They follow the tracks the user picks during playback.
      tags: [users]
      requestBody:
        description: Both playback settings.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePlaybackSettingsRequest"
            example: {"autoplayNextEpisode":false,"askIfStillWatching":true}
      responses:
        "200":
          description: The playback settings have changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackSettings"
              example: {"autoplayNextEpisode":false,"askIfStillWatching":true}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/invites/accept/v1:
    post:
      operationId: acceptInvite
      summary: Accept an invite and become a user
      description: The invite token authorizes the call, so it needs no session token. It creates the user with the invite's email address and ends the invite. Sign the new user in with POST /api/sessions/v1.
      tags: [invites]
      security: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: A UUID the web app keeps per invite token until sign-in succeeds and sends with every accept from it. A repeat with the same key and name returns the user the first accept created.
          schema:
            type: string
            format: uuid
          example: 0f8e2c4a-6b1d-4e3f-9a7c-5d2b8e1f4a6c
      requestBody:
        description: The token from the invite link, and the name and password the person chose.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInviteRequest"
            example: {"token":"Zp3R0vYk8eN1xW5qT7uH2mC4bJ6sL9aF0dG3iK7oP1Q","name":"Noor","password":"a long passphrase about tea"}
      responses:
        "201":
          description: The person is now a user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              example: {"id":"01890a5d-ac96-774b-bcce-b302099a8057","name":"Noor","colour":"amber"}
        "400":
          $ref: "#/components/responses/BadRequestOrInvalidIdempotencyKey"
        "404":
          $ref: "#/components/responses/InviteNotFound"
        "409":
          $ref: "#/components/responses/NameTaken"
        "422":
          $ref: "#/components/responses/EmptyPassword"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/telemetry/traces/v1:
    post:
      operationId: relayTraces
      summary: Relay OTLP traces from an app to the server's collector
      description: Takes OTLP/HTTP protobuf traces and forwards them to the server's own OTLP endpoint over gRPC. It needs a signed-in user's session token.
      tags: [telemetry]
      requestBody:
        description: The traces the app exports.
        required: true
        content:
          application/x-protobuf:
            schema:
              description: A protobuf-encoded opentelemetry.proto.collector.trace.v1.ExportTraceServiceRequest.
              type: string
              contentMediaType: application/x-protobuf
      responses:
        "200":
          description: The collector accepted the traces.
          content:
            application/x-protobuf:
              schema:
                description: The collector's protobuf-encoded opentelemetry.proto.collector.trace.v1.ExportTraceServiceResponse.
                type: string
                contentMediaType: application/x-protobuf
        "400":
          $ref: "#/components/responses/MalformedTelemetry"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/CollectorFailed"
  /api/telemetry/metrics/v1:
    post:
      operationId: relayMetrics
      summary: Relay OTLP metrics from an app to the server's collector
      description: Takes OTLP/HTTP protobuf metrics and forwards them to the server's own OTLP endpoint over gRPC. It needs a signed-in user's session token.
      tags: [telemetry]
      requestBody:
        description: The metrics the app exports.
        required: true
        content:
          application/x-protobuf:
            schema:
              description: A protobuf-encoded opentelemetry.proto.collector.metrics.v1.ExportMetricsServiceRequest.
              type: string
              contentMediaType: application/x-protobuf
      responses:
        "200":
          description: The collector accepted the metrics.
          content:
            application/x-protobuf:
              schema:
                description: The collector's protobuf-encoded opentelemetry.proto.collector.metrics.v1.ExportMetricsServiceResponse.
                type: string
                contentMediaType: application/x-protobuf
        "400":
          $ref: "#/components/responses/MalformedTelemetry"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/CollectorFailed"
  /api/telemetry/logs/v1:
    post:
      operationId: relayLogs
      summary: Relay OTLP logs from an app to the server's collector
      description: Takes OTLP/HTTP protobuf logs and forwards them to the server's own OTLP endpoint over gRPC. It needs a signed-in user's session token.
      tags: [telemetry]
      requestBody:
        description: The logs the app exports.
        required: true
        content:
          application/x-protobuf:
            schema:
              description: A protobuf-encoded opentelemetry.proto.collector.logs.v1.ExportLogsServiceRequest.
              type: string
              contentMediaType: application/x-protobuf
      responses:
        "200":
          description: The collector accepted the logs.
          content:
            application/x-protobuf:
              schema:
                description: The collector's protobuf-encoded opentelemetry.proto.collector.logs.v1.ExportLogsServiceResponse.
                type: string
                contentMediaType: application/x-protobuf
        "400":
          $ref: "#/components/responses/MalformedTelemetry"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/CollectorFailed"
  /api/movies/v1:
    get:
      operationId: listMovies
      summary: A page of the movies grid
      description: Every visible movie, or every visible movie of one genre, in the chosen sort, then by ID. A movie is visible when its file is on disk. The released sort uses the premiere date.
      tags: [browsing]
      parameters:
        - $ref: "#/components/parameters/Genre"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Up to 60 movie tiles, and the cursor for the next page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TilePage"
              example: {"tiles":[{"id":"0190f3c4-5b6a-7c8d-9e0f-1a2b3c4d5e6f","kind":"movie","title":"Arrival","year":2016,"certification":"PG-13","runtimeMinutes":116,"seasonCount":null,"genres":["Drama","Science Fiction"],"plot":"A linguist works with the military to talk to aliens.","images":{"fanart":null,"logo":null,"thumb":null},"progress":null,"watched":false,"episode":null}],"nextCursor":"MDE5MGYzYzQtNWI2YS03YzhkLTllMGYtMWEyYjNjNGQ1ZTZmdGFycml2YWw"}
        "400":
          $ref: "#/components/responses/InvalidGridQuery"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/movies/{movieId}/v1:
    get:
      operationId: getMovie
      summary: The movie page
      description: A visible movie with its details, credits, artwork, the user's progress, the Play target and the More like this row. A movie is visible when its file is on disk.
      tags: [browsing]
      parameters:
        - name: movieId
          in: path
          required: true
          description: The movie's ID.
          schema:
            type: string
            format: uuid
          example: 0190f3c4-5b6a-7c8d-9e0f-1a2b3c4d5e6f
      responses:
        "200":
          description: The movie page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoviePage"
              example: {"id":"0190f3c4-5b6a-7c8d-9e0f-1a2b3c4d5e6f","title":"Arrival","year":2016,"certification":"PG-13","runtimeMinutes":116,"genres":["Drama","Science Fiction"],"rating":7.6,"plot":"A linguist works with the military to talk to aliens.","studio":"Paramount","originalTitle":"Arrival","directors":["Denis Villeneuve"],"mediaFileId":"0190f3c4-c2d3-7e4f-8a5b-6c7d8e9f0a1b","cast":[{"name":"Amy Adams","role":"Louise Banks"}],"images":{"fanart":null,"logo":null},"progress":null,"watched":false,"play":{"resumePosition":null},"moreLikeThis":[{"id":"0190f3c4-6c7d-7e8f-9a0b-1c2d3e4f5a6b","kind":"movie","title":"Dune","year":2021,"certification":"PG-13","runtimeMinutes":155,"seasonCount":null,"genres":["Science Fiction"],"plot":"A noble family becomes embroiled in a war for control of a desert planet.","images":{"fanart":null,"logo":null,"thumb":null},"progress":null,"watched":false,"episode":null}]}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/shows/v1:
    get:
      operationId: listShows
      summary: A page of the shows grid
      description: Every visible show, or every visible show of one genre, in the chosen sort, then by ID. A show is visible when one of its episodes has its file on disk. The added and released sorts use the newest added date and air date among its visible episodes.
      tags: [browsing]
      parameters:
        - $ref: "#/components/parameters/Genre"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Up to 60 show tiles, and the cursor for the next page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TilePage"
              example: {"tiles":[{"id":"0190f3c4-6c7d-7e8f-9a0b-1c2d3e4f5a6b","kind":"show","title":"Severance","year":2022,"certification":"TV-MA","runtimeMinutes":null,"seasonCount":2,"genres":["Drama","Mystery"],"plot":"Office workers have their memories split.","images":{"fanart":null,"logo":null,"thumb":null},"progress":null,"watched":false,"episode":null}],"nextCursor":null}
        "400":
          $ref: "#/components/responses/InvalidGridQuery"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/shows/{showId}/v1:
    get:
      operationId: getShow
      summary: The show page
      description: A visible show with its details, cast, artwork, its visible seasons with Specials last, the Play target and the More like this row. A show is visible when one of its episodes has its file on disk, and a season is listed only when it has a visible episode.
      tags: [browsing]
      parameters:
        - name: showId
          in: path
          required: true
          description: The show's ID.
          schema:
            type: string
            format: uuid
          example: 0190f3c4-6c7d-7e8f-9a0b-1c2d3e4f5a6b
      responses:
        "200":
          description: The show page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowPage"
              example: {"id":"0190f3c4-6c7d-7e8f-9a0b-1c2d3e4f5a6b","title":"Severance","year":2022,"certification":"TV-MA","status":"Continuing","network":"Apple TV+","seasonCount":2,"genres":["Drama","Mystery"],"rating":8.7,"plot":"Office workers have their memories split.","cast":[{"name":"Adam Scott","role":"Mark Scout"}],"images":{"fanart":null,"logo":null},"seasons":[{"id":"0190f3c4-7d8e-7f90-a1b2-c3d4e5f6a7b8","number":1,"name":"Season 1","episodeCount":9},{"id":"0190f3c4-8e9f-7a01-b2c3-d4e5f6a7b8c9","number":2,"name":"Season 2","episodeCount":10},{"id":"0190f3c4-9a0b-7c1d-8e2f-3a4b5c6d7e8f","number":0,"name":"Specials","episodeCount":1}],"play":{"verb":"play","resumePosition":null,"season":{"id":"0190f3c4-7d8e-7f90-a1b2-c3d4e5f6a7b8","number":1},"episode":{"id":"0190f3c4-ab1c-7d2e-8f3a-4b5c6d7e8f9a","number":1,"title":"Good News About Hell","mediaFileId":"0190f3c4-c2d3-7e4f-8a5b-6c7d8e9f0a1b"}},"moreLikeThis":[]}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/seasons/{seasonId}/episodes/v1:
    get:
      operationId: listSeasonEpisodes
      summary: The episodes of a season
      description: Every visible episode of a season, by episode number, unpaged. An episode is visible when its file is on disk. A season with no visible episode is not found.
      tags: [browsing]
      parameters:
        - name: seasonId
          in: path
          required: true
          description: The season's ID.
          schema:
            type: string
            format: uuid
          example: 0190f3c4-7d8e-7f90-a1b2-c3d4e5f6a7b8
      responses:
        "200":
          description: The season's episodes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpisodeList"
              example: {"episodes":[{"id":"0190f3c4-ab1c-7d2e-8f3a-4b5c6d7e8f9a","number":1,"title":"Good News About Hell","runtimeMinutes":57,"plot":"Mark leads a team of office workers.","thumb":null,"mediaFileId":"0190f3c4-c2d3-7e4f-8a5b-6c7d8e9f0a1b","progress":null,"watched":false}]}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/episodes/{episodeId}/v1:
    get:
      operationId: getEpisode
      summary: The episode page
      description: A visible episode with its details, thumb, its show, and the audio and subtitle languages of its media file. An episode is visible when its file is on disk. The two episodes of a file that holds both share its languages and runtime.
      tags: [browsing]
      parameters:
        - name: episodeId
          in: path
          required: true
          description: The episode's ID.
          schema:
            type: string
            format: uuid
          example: 0190f3c4-ab1c-7d2e-8f3a-4b5c6d7e8f9a
      responses:
        "200":
          description: The episode page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpisodePage"
              example: {"id":"0190f3c4-ab1c-7d2e-8f3a-4b5c6d7e8f9a","title":"Half Loop","seasonNumber":1,"episodeNumber":2,"airDate":"2022-02-18","runtimeMinutes":57,"rating":8.1,"plot":"Mark takes Helly to the break room.","thumb":null,"show":{"id":"0190f3c4-6c7d-7e8f-9a0b-1c2d3e4f5a6b","title":"Severance","logo":null},"audioLanguages":["eng"],"subtitleLanguages":[{"language":"eng","hearingImpaired":false,"forced":true},{"language":"en","hearingImpaired":true,"forced":false}],"mediaFileId":"0190f3c4-c2d3-7e4f-8a5b-6c7d8e9f0a1b","progress":null,"watched":false,"play":{"resumePosition":null}}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/genres/v1:
    get:
      operationId: listGenres
      summary: The genres of the movies or shows grid
      description: Every genre with at least one visible title of the kind, with the number of those titles, sorted by name. A title with several genres counts once in each.
      tags: [browsing]
      parameters:
        - name: kind
          in: query
          required: true
          description: Whether to list the genres of movies or of shows.
          schema:
            $ref: "#/components/schemas/GenreKind"
          example: movie
      responses:
        "200":
          description: The genres, sorted by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenreList"
              example: {"genres":[{"name":"Drama","count":2},{"name":"Science Fiction","count":1}]}
        "400":
          $ref: "#/components/responses/InvalidGenreKind"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/home/v1:
    get:
      operationId: getHome
      summary: The featured title and the rows of Home
      description: The rows come in this order, each with up to 20 tiles, and empty rows are left out. Recently added holds one tile per movie and per show, newest added first; a show counts the newest added date among its visible episodes. The genre rows are the 6 genres with the most visible titles, movies and shows together, each sorted by sort title. With nobody having played anything, the featured title is the latest released title, a movie by its premiere date and a show by the air date of its newest visible episode. Undated titles are skipped and ties go by sort title.
      tags: [browsing]
      responses:
        "200":
          description: The featured title, or null when no title has a release date, and the rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Home"
              example: {"featured":{"tile":{"id":"0190f3c4-5b6a-7c8d-9e0f-1a2b3c4d5e6f","kind":"movie","title":"Arrival","year":2016,"certification":"PG-13","runtimeMinutes":116,"seasonCount":null,"genres":["Drama","Science Fiction"],"plot":"A linguist works with the military to talk to aliens.","images":{"fanart":null,"logo":null,"thumb":null},"progress":null,"watched":false,"episode":null},"playEpisodeId":null},"rows":[{"kind":"recentlyAdded","genre":null,"tiles":[{"id":"0190f3c4-5b6a-7c8d-9e0f-1a2b3c4d5e6f","kind":"movie","title":"Arrival","year":2016,"certification":"PG-13","runtimeMinutes":116,"seasonCount":null,"genres":["Drama","Science Fiction"],"plot":"A linguist works with the military to talk to aliens.","images":{"fanart":null,"logo":null,"thumb":null},"progress":null,"watched":false,"episode":null}]},{"kind":"genre","genre":"Drama","tiles":[{"id":"0190f3c4-5b6a-7c8d-9e0f-1a2b3c4d5e6f","kind":"movie","title":"Arrival","year":2016,"certification":"PG-13","runtimeMinutes":116,"seasonCount":null,"genres":["Drama","Science Fiction"],"plot":"A linguist works with the military to talk to aliens.","images":{"fanart":null,"logo":null,"thumb":null},"progress":null,"watched":false,"episode":null}]}]}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
  /webhooks/radarr/v1:
    post:
      operationId: postRadarrWebhook
      summary: Store a webhook delivery that Radarr sends by POST
      description: The server checks only the HTTP Basic password, against RADARR__WEBHOOK_PASSWORD, and stores the delivery in the inbox. The inbox worker then re-syncs the movie a library event names.
      tags: [webhooks]
      security:
        - webhookPassword: []
      requestBody:
        $ref: "#/components/requestBodies/RadarrWebhook"
      responses:
        "200":
          $ref: "#/components/responses/WebhookStored"
        "401":
          $ref: "#/components/responses/WrongWebhookPassword"
        "500":
          $ref: "#/components/responses/WebhookNotStored"
    put:
      operationId: putRadarrWebhook
      summary: Store a webhook delivery that Radarr sends by PUT
      description: The same as POST /webhooks/radarr/v1, for a Radarr webhook set to the PUT method.
      tags: [webhooks]
      security:
        - webhookPassword: []
      requestBody:
        $ref: "#/components/requestBodies/RadarrWebhook"
      responses:
        "200":
          $ref: "#/components/responses/WebhookStored"
        "401":
          $ref: "#/components/responses/WrongWebhookPassword"
        "500":
          $ref: "#/components/responses/WebhookNotStored"
  /webhooks/sonarr/v1:
    post:
      operationId: postSonarrWebhook
      summary: Store a webhook delivery that Sonarr sends by POST
      description: The server checks only the HTTP Basic password, against SONARR__WEBHOOK_PASSWORD, and stores the delivery in the inbox. The inbox worker then re-syncs the show a library event names.
      tags: [webhooks]
      security:
        - webhookPassword: []
      requestBody:
        $ref: "#/components/requestBodies/SonarrWebhook"
      responses:
        "200":
          $ref: "#/components/responses/WebhookStored"
        "401":
          $ref: "#/components/responses/WrongWebhookPassword"
        "500":
          $ref: "#/components/responses/WebhookNotStored"
    put:
      operationId: putSonarrWebhook
      summary: Store a webhook delivery that Sonarr sends by PUT
      description: The same as POST /webhooks/sonarr/v1, for a Sonarr webhook set to the PUT method.
      tags: [webhooks]
      security:
        - webhookPassword: []
      requestBody:
        $ref: "#/components/requestBodies/SonarrWebhook"
      responses:
        "200":
          $ref: "#/components/responses/WebhookStored"
        "401":
          $ref: "#/components/responses/WrongWebhookPassword"
        "500":
          $ref: "#/components/responses/WebhookNotStored"
  /api/images/{imageId}/{width}/v1:
    get:
      operationId: getImage
      summary: One artwork image at one width
      description: The signed query string authorizes the call, so it needs no session token. Take the URL from an image in another response. Fanart comes at 480 and 960 for tiles and 1280 and 1920 for backdrops, episode thumbs at 480 and 960, and clearlogos at 300 and 600. An image narrower than the width comes at its own size. A JPEG stays a JPEG and a PNG stays a PNG.
      tags: [images]
      security: []
      parameters:
        - name: imageId
          in: path
          required: true
          description: The image's ID.
          schema:
            type: string
            format: uuid
          example: 0190f3c4-7d8e-7f90-a1b2-c3d4e5f6a7b8
        - name: width
          in: path
          required: true
          description: One of the widths the image comes in, in pixels.
          schema:
            type: integer
          example: 480
        - name: expires
          in: query
          required: true
          description: When the URL stops working, in seconds since the Unix epoch. It is the end of the UTC day after the one the server signed it on.
          schema:
            type: integer
          example: 1793836800
        - name: signature
          in: query
          required: true
          description: The server's signature of the image, its width, its modification time and the expiry.
          schema:
            type: string
          example: Jm2vX8kQ0rH3c1yF5bR7tVw9nL4pA6sD0eG2iK8uO1M
      responses:
        "200":
          description: The image. The app may cache it until the URL expires.
          headers:
            Cache-Control:
              description: private, with max-age set to the seconds until the URL expires.
              schema:
                type: string
              example: private, max-age=136800
          content:
            image/jpeg:
              schema:
                description: A JPEG image, for fanart and thumbs.
                type: string
                contentMediaType: image/jpeg
            image/png:
              schema:
                description: A PNG image with transparency, for clearlogos.
                type: string
                contentMediaType: image/png
        "403":
          $ref: "#/components/responses/InvalidSignature"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/playbacks/v1:
    post:
      operationId: startPlayback
      summary: Start a playback of a media file
      description: The server compares the capability profile with the media file and picks the play method. It plays the file directly when the profile covers its container, its video stream and the selected audio track, which is the file's default audio track, else its first. When only the container is wrong and the server can read the file's keyframes, or when the request forces HLS, it remuxes the file to HLS and the URL is the HLS master playlist. When the profile doesn't cover the video stream, or the file has no keyframe at least every 20 seconds, it transcodes the video to H.264 at the source size up to 1080p and the source bitrate up to 10 Mbps, tone-mapping HDR to SDR and deinterlacing interlaced video. Dolby Vision plays as its HDR10 base layer where the profile lists hdr10. A file whose audio needs a transcode fails with the needs-transcode problem for now. Starting a playback ends any playback the same session has not ended. A media file is hidden when no visible movie or episode plays from it.
      tags: [playback]
      requestBody:
        description: The media file, the start position and the device's capability profile.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartPlaybackRequest"
            example: {"mediaFileId":"0190f3c4-c2d3-7e4f-8a5b-6c7d8e9f0a1b","startPosition":0,"profile":{"containers":["mp4","webm"],"videoCodecs":[{"codec":"h264","profiles":["main","high"],"maxWidth":3840,"maxHeight":2160,"hdrTypes":["sdr"]}],"audioCodecs":[{"codec":"aac","maxChannels":2}],"subtitleCodecs":[]}}
      responses:
        "201":
          description: The playback, with the URL the player plays.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playback"
              example: {"playbackId":"0190f3c4-d3e4-7f5a-8b6c-7d8e9f0a1b2c","method":"directPlay","reasons":[],"url":"/api/playbacks/0190f3c4-d3e4-7f5a-8b6c-7d8e9f0a1b2c/media/Jm2vX8kQ0rH3c1yF5bR7tVw9nL4pA6sD0eG2iK8uO1M/v1/file","duration":6981.0,"movie":{"id":"0190f3c4-5b6a-7c8d-9e0f-1a2b3c4d5e6f","title":"Arrival"},"episodes":[],"audioTracks":[{"id":"0190f3c4-e4f5-7a6b-8c7d-8e9f0a1b2c3d","language":"eng","label":"Stereo","codec":"aac","channels":2,"default":true,"inStream":true}],"subtitleTracks":[]}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnreadableMediaFile"
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          $ref: "#/components/responses/NeedsTranscode"
  /api/playbacks/{playbackId}/progress/v1:
    put:
      operationId: reportPlaybackProgress
      summary: Report how far a playback has got
      description: The player sends a report every 10 seconds while playing or paused, at once on pause, and on stop. The server stores the position and paused state with the time of the report. A stop report ends the playback, and so do 60 seconds with no report. An unknown playback, or one of another user, is not found. A report for an ended playback fails with the playback-ended problem, and the player then starts a new playback at its position, unless the report was a stop.
      tags: [playback]
      parameters:
        - $ref: "#/components/parameters/PlaybackId"
      requestBody:
        description: The player's position and state.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressReport"
            example: {"position":1534.2,"paused":false,"stopped":false}
      responses:
        "204":
          description: The report is stored.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFoundOrPlaybackEnded"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/playbacks/{playbackId}/media/{signature}/v1/file:
    get:
      operationId: getPlaybackFile
      summary: The media file of a direct play
      description: The signature in the path authorizes the call, so it needs no session token. Take the URL from the playback. It works until the playback ends, and is not found after that. The file is served as it is on disk, and the player fetches parts of it with HTTP range requests.
      tags: [media]
      security: []
      parameters:
        - $ref: "#/components/parameters/PlaybackId"
        - $ref: "#/components/parameters/PlaybackSignature"
        - name: Range
          in: header
          required: false
          description: The bytes to send, such as bytes=0-1023. Leave it out for the whole file.
          schema:
            type: string
          example: bytes=0-1023
      responses:
        "200":
          description: The whole media file.
          headers:
            Accept-Ranges:
              description: Always bytes.
              schema:
                type: string
                const: bytes
          content:
            video/mp4:
              schema:
                $ref: "#/components/schemas/MediaFileBytes"
            video/webm:
              schema:
                $ref: "#/components/schemas/MediaFileBytes"
            video/x-matroska:
              schema:
                $ref: "#/components/schemas/MediaFileBytes"
            video/quicktime:
              schema:
                $ref: "#/components/schemas/MediaFileBytes"
            application/octet-stream:
              schema:
                $ref: "#/components/schemas/MediaFileBytes"
        "206":
          description: The bytes of the Range header.
          headers:
            Content-Range:
              description: The bytes sent and the size of the file, such as bytes 0-1023/5242880.
              schema:
                type: string
              example: bytes 0-1023/5242880
          content:
            video/mp4:
              schema:
                $ref: "#/components/schemas/MediaFileBytes"
            video/webm:
              schema:
                $ref: "#/components/schemas/MediaFileBytes"
            video/x-matroska:
              schema:
                $ref: "#/components/schemas/MediaFileBytes"
            video/quicktime:
              schema:
                $ref: "#/components/schemas/MediaFileBytes"
            application/octet-stream:
              schema:
                $ref: "#/components/schemas/MediaFileBytes"
        "403":
          $ref: "#/components/responses/InvalidSignature"
        "404":
          $ref: "#/components/responses/NotFound"
        "416":
          description: The Range header asks for bytes past the end of the file.
          headers:
            Content-Range:
              description: The size of the file, such as bytes */5242880.
              schema:
                type: string
              example: bytes */5242880
        "500":
          $ref: "#/components/responses/InternalError"
  /api/playbacks/{playbackId}/media/{signature}/v1/{fileName}:
    get:
      operationId: getPlaybackHlsFile
      summary: A playlist, segment or subtitle file of an HLS playback
      description: The signature in the path authorizes the call, so it needs no session token. The player reaches these files from the playback's main.m3u8, whose URLs are relative. They work until the playback ends, and are not found after that. A segment that exists is sent at once. One just ahead of the running ffmpeg is sent when ffmpeg has written it. Any other segment restarts ffmpeg at that segment. An embedded text subtitle has a WebVTT segment for each video segment, on the same times. A subtitle file beside the media file is converted whole to one WebVTT file when it is first asked for.
      tags: [media]
      security: []
      parameters:
        - $ref: "#/components/parameters/PlaybackId"
        - $ref: "#/components/parameters/PlaybackSignature"
        - name: fileName
          in: path
          required: true
          description: main.m3u8, video.m3u8, init.mp4, a segment named by its index, such as 12.m4s, a subtitle playlist named by its place in main.m3u8, such as subtitles-0.m3u8, a WebVTT segment of an embedded subtitle, such as subtitles-0-12.vtt, or the WebVTT file of a subtitle file beside the media file, such as subtitles-2.vtt.
          schema:
            type: string
          example: main.m3u8
      responses:
        "200":
          description: The playlist or segment.
          content:
            application/vnd.apple.mpegurl:
              schema:
                $ref: "#/components/schemas/HlsPlaylist"
            video/mp4:
              schema:
                $ref: "#/components/schemas/HlsSegmentBytes"
            video/iso.segment:
              schema:
                $ref: "#/components/schemas/HlsSegmentBytes"
            text/vtt:
              schema:
                $ref: "#/components/schemas/WebVtt"
        "403":
          $ref: "#/components/responses/InvalidSignature"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
tags:
  - name: actuator
    description: Health and info endpoints in the shape of Spring Boot Actuator.
  - name: sessions
    description: Signing users in and out of the web and TV apps.
  - name: users
    description: The users of the household.
  - name: invites
    description: The invites that add users to the household.
  - name: telemetry
    description: The relay that forwards OTLP from the web and TV apps to the server's collector.
  - name: browsing
    description: The movies, shows and episodes a user browses in the web and TV apps.
  - name: webhooks
    description: The webhooks Radarr and Sonarr send when the library changes.
  - name: images
    description: The artwork images that tiles and pages draw, fetched through signed URLs.
  - name: playback
    description: Playing a movie or episode and reporting how far it has got.
  - name: media
    description: The media a playback plays, fetched through signed URLs.
components:
  securitySchemes:
    sessionToken:
      description: A session token from POST /api/sessions/v1, sent as Authorization Bearer.
      type: http
      scheme: bearer
    webhookPassword:
      description: HTTP Basic credentials that Radarr or Sonarr sends. The server checks only the password.
      type: http
      scheme: basic
  requestBodies:
    RadarrWebhook:
      description: The webhook delivery as Radarr sends it.
      required: true
      content:
        application/json:
          schema:
            type: object
          example: {"eventType":"Test"}
    SonarrWebhook:
      description: The webhook delivery as Sonarr sends it.
      required: true
      content:
        application/json:
          schema:
            type: object
          example: {"eventType":"Test"}
  parameters:
    PlaybackSignature:
      name: signature
      in: path
      required: true
      description: The server's signature of the playback ID.
      schema:
        type: string
      example: Jm2vX8kQ0rH3c1yF5bR7tVw9nL4pA6sD0eG2iK8uO1M
    PlaybackId:
      name: playbackId
      in: path
      required: true
      description: The playback's ID.
      schema:
        type: string
        format: uuid
      example: 0190f3c4-d3e4-7f5a-8b6c-7d8e9f0a1b2c
    Cursor:
      name: cursor
      in: query
      required: false
      description: The nextCursor of the previous page, fetched with the same genre and sort. Leave it out for the first page.
      schema:
        type: string
      example: MDE5MGYzYzQtNWI2YS03YzhkLTllMGYtMWEyYjNjNGQ1ZTZmdGFycml2YWw
    Genre:
      name: genre
      in: query
      required: false
      description: Only list the titles of this genre, a name from GET /api/genres/v1. Leave it out for every genre.
      schema:
        type: string
      example: Comedy
    Sort:
      name: sort
      in: query
      required: false
      description: The order of the grid. title is by sort title, A to Z. added is newest added first. released is newest release first, with undated titles last. Each sort breaks ties by ID.
      schema:
        type: string
        enum: [title, added, released]
        default: title
      example: added
  responses:
    WebhookStored:
      description: The delivery is stored in the inbox.
    WebhookNotStored:
      description: The server could not store the delivery.
    WrongWebhookPassword:
      description: The password is wrong or missing. The server stores nothing and counts a rejected webhook for the source.
      headers:
        WWW-Authenticate:
          description: The HTTP Basic challenge.
          schema:
            type: string
            const: Basic realm="selfless"
    MalformedTelemetry:
      description: The body is not a valid OTLP protobuf request for this signal.
    CollectorFailed:
      description: The collector did not accept the request. The app may retry.
    BadRequest:
      description: The body is not JSON, or it lacks a field or has one of the wrong type. Nothing changes.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - properties:
                  type:
                    const: urn:selfless:problem:bad-request
                  status:
                    const: 400
          example: {"type":"urn:selfless:problem:bad-request","title":"The request body is not valid.","status":400}
    BadRequestOrInvalidIdempotencyKey:
      description: The body is not JSON, or it lacks a field or has one of the wrong type, or the Idempotency-Key header is missing or not a UUID. Each has its own problem type. Nothing changes.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - properties:
                  type:
                    enum: [urn:selfless:problem:bad-request, urn:selfless:problem:invalid-idempotency-key]
                  status:
                    const: 400
          examples:
            badRequest:
              value: {"type":"urn:selfless:problem:bad-request","title":"The request body is not valid.","status":400}
            invalidIdempotencyKey:
              value: {"type":"urn:selfless:problem:invalid-idempotency-key","title":"The Idempotency-Key header is not valid.","status":400}
    Unauthenticated:
      description: The request has no Authorization header with a Bearer token, or the token is unknown or its session has ended.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - properties:
                  type:
                    const: urn:selfless:problem:unauthenticated
                  status:
                    const: 401
          example: {"type":"urn:selfless:problem:unauthenticated","title":"The request has no valid session token.","status":401}
    WrongNameOrPassword:
      description: No user has this name, or the password is wrong. Both give the same problem.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - properties:
                  type:
                    const: urn:selfless:problem:wrong-name-or-password
                  status:
                    const: 401
          example: {"type":"urn:selfless:problem:wrong-name-or-password","title":"The name or password is wrong.","status":401}
    WrongCurrentPassword:
      description: The current password is wrong. Nothing changes.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - properties:
                  type:
                    const: urn:selfless:problem:wrong-current-password
                  status:
                    const: 403
          example: {"type":"urn:selfless:problem:wrong-current-password","title":"The current password is wrong.","status":403}
    EmptyPassword:
      description: The new password is empty. A password can be any string except the empty one. Nothing changes.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - properties:
                  type:
                    const: urn:selfless:problem:empty-password
                  status:
                    const: 422
          example: {"type":"urn:selfless:problem:empty-password","title":"The password is empty.","status":422}
    NameTaken:
      description: A user already has this name, in any capitals. The invite stays usable with another name.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - properties:
                  type:
                    const: urn:selfless:problem:name-taken
                  status:
                    const: 409
          example: {"type":"urn:selfless:problem:name-taken","title":"A user already has this name.","status":409}
    InviteNotFound:
      description: No pending invite has this token. The token is unknown, the invite was already accepted or cancelled, or it expired.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - properties:
                  type:
                    const: urn:selfless:problem:invite-not-found
                  status:
                    const: 404
          example: {"type":"urn:selfless:problem:invite-not-found","title":"The invite link no longer works.","status":404}
    InvalidGridQuery:
      description: The sort is not title, added or released, or the cursor is not a nextCursor the server returned for that sort.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - properties:
                  type:
                    const: urn:selfless:problem:bad-request
                  status:
                    const: 400
          example: {"type":"urn:selfless:problem:bad-request","title":"The request body is not valid.","status":400}
    InvalidGenreKind:
      description: The kind is missing, or it is not movie or show.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - properties:
                  type:
                    const: urn:selfless:problem:bad-request
                  status:
                    const: 400
          example: {"type":"urn:selfless:problem:bad-request","title":"The request body is not valid.","status":400}
    NotFound:
      description: Nothing exists at this URL, such as an unknown ID or an image width that is not offered.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - properties:
                  type:
                    const: urn:selfless:problem:not-found
                  status:
                    const: 404
          example: {"type":"urn:selfless:problem:not-found","title":"Nothing exists at this URL.","status":404}
    NotFoundOrPlaybackEnded:
      description: The playback is unknown or belongs to another user, or it has ended. Each has its own problem type.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - properties:
                  type:
                    enum: [urn:selfless:problem:not-found, urn:selfless:problem:playback-ended]
                  status:
                    const: 404
          examples:
            notFound:
              value: {"type":"urn:selfless:problem:not-found","title":"Nothing exists at this URL.","status":404}
            playbackEnded:
              value: {"type":"urn:selfless:problem:playback-ended","title":"The playback has ended.","status":404}
    InvalidSignature:
      description: The signed URL has no signature, a wrong one, or it has expired. Get a new URL from the response that gave this one.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - properties:
                  type:
                    const: urn:selfless:problem:invalid-signature
                  status:
                    const: 403
          example: {"type":"urn:selfless:problem:invalid-signature","title":"The signed URL is not valid or has expired.","status":403}
    UnreadableMediaFile:
      description: Library sync couldn't read the media file's container or streams, so selfless can't play it.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - properties:
                  type:
                    const: urn:selfless:problem:unreadable-media-file
                  status:
                    const: 422
          example: {"type":"urn:selfless:problem:unreadable-media-file","title":"selfless can't read this media file.","status":422}
    NeedsTranscode:
      description: The profile doesn't cover the selected audio track of the media file, so it needs an audio transcode, which the server can't do yet.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - properties:
                  type:
                    const: urn:selfless:problem:needs-transcode
                  status:
                    const: 501
          example: {"type":"urn:selfless:problem:needs-transcode","title":"The media file needs a transcode, which the server can't do yet.","status":501}
    InternalError:
      description: The server failed. The body holds no error details, and the server logs the error.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - properties:
                  type:
                    const: urn:selfless:problem:internal-error
                  status:
                    const: 500
          example: {"type":"urn:selfless:problem:internal-error","title":"Something went wrong on the server.","status":500}
  schemas:
    Problem:
      description: An RFC 9457 problem details object. The type is stable and identifies the problem.
      type: object
      required: [type, title, status]
      properties:
        type:
          description: A URI that identifies the problem type.
          type: string
          format: uri
          examples: ["urn:selfless:problem:unauthenticated"]
        title:
          description: A short summary of the problem type, in English.
          type: string
          examples: ["The request has no valid session token."]
        status:
          description: The HTTP status code.
          type: integer
          examples: [401]
    ClientKind:
      description: The app a session was started on.
      type: string
      enum: [web, appleTv, googleTv]
      examples: [web]
    UserColour:
      description: The user's colour, a design token name from the user picker.
      type: string
      enum: [amber, blue, pink, emerald]
      examples: [amber]
    User:
      description: A household member who watches.
      type: object
      required: [id, name, colour]
      properties:
        id:
          description: The user's ID, a UUID v7.
          type: string
          format: uuid
          examples: ["01890a5d-ac96-774b-bcce-b302099a8057"]
        name:
          description: The user's name as they typed it. It is unique ignoring case.
          type: string
          examples: [Noor]
        colour:
          $ref: "#/components/schemas/UserColour"
      additionalProperties: false
    SignInRequest:
      description: A user's name and password, and the client they sign in on.
      type: object
      required: [name, password, clientKind, deviceName, clientId]
      properties:
        name:
          description: The user's name, in any capitals.
          type: string
          examples: [Noor]
        password:
          description: The user's password.
          type: string
          examples: [a long passphrase about tea]
        clientKind:
          $ref: "#/components/schemas/ClientKind"
        deviceName:
          description: A name for the device, shown to admins in the user's sessions.
          type: string
          examples: [Firefox on macOS]
        clientId:
          description: A random id the app makes once per install or browser and sends with every sign-in. Signing in again as the same user with the same id replaces that user's earlier session from it.
          type: string
          format: uuid
          examples: [0f8e3c2a-5b7d-4e19-9a64-2c1d8b7f6e30]
    SignedIn:
      description: A new session's token and the user it belongs to.
      type: object
      required: [token, user]
      properties:
        token:
          description: The session token, 32 random bytes in base64url without padding. Send it as a Bearer token.
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
          examples: [q2Xz8kQ0mJ3Hc1yF5bR7tVw9nL4pA6sD0eG2iK8uO1M]
        user:
          $ref: "#/components/schemas/User"
      additionalProperties: false
    ChangePasswordRequest:
      description: The user's current password and the new one.
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          description: The password the user signs in with now.
          type: string
          examples: [a long passphrase about tea]
        newPassword:
          description: The new password. Any non-empty string.
          type: string
          minLength: 1
          examples: [a longer passphrase about coffee]
    PlaybackSettings:
      description: How playback behaves for a user, on every device.
      type: object
      required: [autoplayNextEpisode, askIfStillWatching]
      properties:
        autoplayNextEpisode:
          description: Whether the Next episode button counts down and plays the next episode by itself. On for a new user.
          type: boolean
          examples: [true]
        askIfStillWatching:
          description: Whether playback pauses and asks "Are you still watching?" after three episodes autoplayed with no interaction. Off for a new user.
          type: boolean
          examples: [false]
      additionalProperties: false
    ChangePlaybackSettingsRequest:
      description: Both playback settings of the signed-in user.
      type: object
      required: [autoplayNextEpisode, askIfStillWatching]
      properties:
        autoplayNextEpisode:
          description: Whether the Next episode button counts down and plays the next episode by itself.
          type: boolean
          examples: [false]
        askIfStillWatching:
          description: Whether playback pauses and asks "Are you still watching?" after three episodes autoplayed with no interaction.
          type: boolean
          examples: [true]
    AcceptInviteRequest:
      description: The token from an invite link, and the name and password the invited person chose.
      type: object
      required: [token, name, password]
      properties:
        token:
          description: The invite token from the fragment of the invite link.
          type: string
          examples: [Zp3R0vYk8eN1xW5qT7uH2mC4bJ6sL9aF0dG3iK7oP1Q]
        name:
          description: The name the person chose. It must be unique ignoring case.
          type: string
          examples: [Noor]
        password:
          description: The password the person chose. Any non-empty string.
          type: string
          minLength: 1
          examples: [a long passphrase about tea]
    HealthStatus:
      description: The status of a health group or component, as in Spring Boot Actuator.
      type: string
      enum: [UP, DOWN, OUT_OF_SERVICE, UNKNOWN]
      examples: [UP]
    HealthComponent:
      description: One health component, shown without details.
      type: object
      required: [status]
      examples:
        - status: UP
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
      additionalProperties: false
    Health:
      description: Overall health with the db, livenessState and readinessState components.
      type: object
      required: [status, components]
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
        components:
          type: object
          required: [db, livenessState, readinessState]
          properties:
            db:
              $ref: "#/components/schemas/HealthComponent"
            livenessState:
              $ref: "#/components/schemas/HealthComponent"
            readinessState:
              $ref: "#/components/schemas/HealthComponent"
          additionalProperties: false
      additionalProperties: false
    LivenessHealth:
      description: The liveness group. It reports only the process's own state.
      type: object
      required: [status, components]
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
        components:
          type: object
          required: [livenessState]
          properties:
            livenessState:
              $ref: "#/components/schemas/HealthComponent"
          additionalProperties: false
      additionalProperties: false
    ReadinessHealth:
      description: The readiness group. It reports whether the server accepts traffic and reaches PostgreSQL.
      type: object
      required: [status, components]
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
        components:
          type: object
          required: [db, readinessState]
          properties:
            db:
              $ref: "#/components/schemas/HealthComponent"
            readinessState:
              $ref: "#/components/schemas/HealthComponent"
          additionalProperties: false
      additionalProperties: false
    Info:
      description: Build and git information in the shape of Spring Boot Actuator's info endpoint, with git in simple mode.
      type: object
      required: [build, git]
      properties:
        build:
          description: The server build.
          type: object
          required: [name, version]
          properties:
            name:
              description: The name of the root crate.
              type: string
              examples: [selfless]
            version:
              description: The version of the root crate.
              type: string
              examples: [0.1.0]
          additionalProperties: false
        git:
          description: The git commit the server was built from.
          type: object
          required: [branch, commit]
          properties:
            branch:
              description: The branch the server was built from.
              type: string
              examples: [main]
            commit:
              description: The commit the server was built from.
              type: object
              required: [id, time]
              properties:
                id:
                  description: The first 8 characters of the commit hash, as in the image tag.
                  type: string
                  pattern: "^[0-9a-f]{8}$"
                  examples: [56ad9034]
                time:
                  description: The commit time in UTC.
                  type: string
                  format: date-time
                  examples: ["2026-10-29T06:12:00Z"]
              additionalProperties: false
          additionalProperties: false
      additionalProperties: false
    TilePage:
      description: One page of tiles, in order.
      type: object
      required: [tiles, nextCursor]
      properties:
        tiles:
          description: Up to 60 tiles.
          type: array
          maxItems: 60
          items:
            $ref: "#/components/schemas/Tile"
          examples:
            - [{"id":"0190f3c4-5b6a-7c8d-9e0f-1a2b3c4d5e6f","kind":"movie","title":"Arrival","year":2016,"certification":"PG-13","runtimeMinutes":116,"seasonCount":null,"genres":["Drama","Science Fiction"],"plot":"A linguist works with the military to talk to aliens.","images":{"fanart":null,"logo":null,"thumb":null},"progress":null,"watched":false,"episode":null}]
        nextCursor:
          description: Pass it as the cursor query parameter to get the next page. It is null on the last page.
          type: [string, "null"]
          examples: [MDE5MGYzYzQtNWI2YS03YzhkLTllMGYtMWEyYjNjNGQ1ZTZmdGFycml2YWw]
      additionalProperties: false
    TileKind:
      description: What a tile shows.
      type: string
      enum: [movie, show, episode]
      examples: [movie]
    Tile:
      description: A movie, show or episode with everything the TV's focused details show, so focusing a tile makes no request. For an episode, the id, title, year, runtimeMinutes and plot are the episode's, and the certification and genres are its show's.
      type: object
      required: [id, kind, title, year, certification, runtimeMinutes, seasonCount, genres, plot, images, progress, watched, episode]
      properties:
        id:
          description: The ID of the movie, show or episode.
          type: string
          format: uuid
          examples: ["0190f3c4-5b6a-7c8d-9e0f-1a2b3c4d5e6f"]
        kind:
          $ref: "#/components/schemas/TileKind"
        title:
          type: string
          examples: [Arrival]
        year:
          type: [integer, "null"]
          examples: [2016]
        certification:
          description: The age rating from the NFO file, such as PG-13.
          type: [string, "null"]
          examples: [PG-13]
        runtimeMinutes:
          description: The runtime of a movie or episode. It is null for a show.
          type: [integer, "null"]
          examples: [116]
        seasonCount:
          description: The number of numbered seasons of a show with a visible episode, without Specials. It is null for a movie or episode.
          type: [integer, "null"]
          examples: [2]
        genres:
          type: array
          items:
            type: string
          examples: [[Drama, Science Fiction]]
        plot:
          type: [string, "null"]
          examples: [A linguist works with the military to talk to aliens.]
        images:
          $ref: "#/components/schemas/TileImages"
        progress:
          description: How far the user got, from 0 to 1, when they have a resume position. Otherwise null.
          type: [number, "null"]
          minimum: 0
          maximum: 1
          examples: [0.42]
        watched:
          description: Whether the user has watched the movie or episode, or every episode of the show.
          type: boolean
          examples: [false]
        episode:
          description: The episode's show and numbers. It is null for a movie or show.
          anyOf:
            - $ref: "#/components/schemas/TileEpisode"
            - type: "null"
      additionalProperties: false
    TileImages:
      description: The artwork a tile draws. A missing image is null, and the app draws a placeholder.
      type: object
      required: [fanart, logo, thumb]
      properties:
        fanart:
          description: The fanart of the movie or show, or of an episode's show.
          anyOf:
            - $ref: "#/components/schemas/Artwork"
            - type: "null"
        logo:
          description: The clearlogo of the movie or show. It is null for an episode, whose show's logo is in episode.show.
          anyOf:
            - $ref: "#/components/schemas/Artwork"
            - type: "null"
        thumb:
          description: The thumb of an episode. It is null for a movie or show.
          anyOf:
            - $ref: "#/components/schemas/Artwork"
            - type: "null"
      additionalProperties: false
    TileEpisode:
      description: Where an episode belongs.
      type: object
      required: [show, seasonNumber, episodeNumber, mediaFileId]
      properties:
        show:
          type: object
          required: [id, title, logo]
          properties:
            id:
              type: string
              format: uuid
              examples: ["0190f3c4-6c7d-7e8f-9a0b-1c2d3e4f5a6b"]
            title:
              type: string
              examples: [Severance]
            logo:
              anyOf:
                - $ref: "#/components/schemas/Artwork"
                - type: "null"
          additionalProperties: false
        seasonNumber:
          description: The season number. Specials are 0.
          type: integer
          examples: [2]
        episodeNumber:
          type: integer
          examples: [4]
        mediaFileId:
          description: The media file the episode plays from, for POST /api/playbacks/v1. The episodes of a file that holds two share its ID. Null only while library sync has linked no file.
          type: [string, "null"]
          format: uuid
          examples: ["0190f3c4-c2d3-7e4f-8a5b-6c7d8e9f0a1b"]
      additionalProperties: false
    Artwork:
      description: One artwork image, with a URL for each width it comes in. The URLs change when the image changes, and they expire at the end of the UTC day after the one they were made on.
      type: object
      required: [urls]
      properties:
        urls:
          type: array
          items:
            $ref: "#/components/schemas/ArtworkUrl"
      additionalProperties: false
    ArtworkUrl:
      description: The image at one width.
      type: object
      required: [width, url]
      properties:
        width:
          description: The width in pixels.
          type: integer
          examples: [480]
        url:
          description: A signed URL that needs no Authorization header.
          type: string
          format: uri-reference
          examples: ["/api/images/0190f3c4-7d8e-7f90-a1b2-c3d4e5f6a7b8/480/v1?expires=1793836800&signature=Jm2vX8kQ0rH3c1yF5bR7tVw9nL4pA6sD0eG2iK8uO1M"]
      additionalProperties: false
    MoviePage:
      description: Everything the movie page shows.
      type: object
      required: [id, title, year, certification, runtimeMinutes, genres, rating, plot, studio, originalTitle, directors, mediaFileId, cast, images, progress, watched, play, moreLikeThis]
      properties:
        id:
          type: string
          format: uuid
          examples: ["0190f3c4-5b6a-7c8d-9e0f-1a2b3c4d5e6f"]
        title:
          type: string
          examples: [Arrival]
        year:
          type: integer
          examples: [2016]
        certification:
          description: The age rating from the movie's NFO file.
          type: [string, "null"]
          examples: [PG-13]
        runtimeMinutes:
          type: [integer, "null"]
          examples: [116]
        genres:
          type: array
          items:
            type: string
          examples: [[Drama, Science Fiction]]
        rating:
          description: The TMDB rating from the NFO file, from 0 to 10.
          type: [number, "null"]
          examples: [7.6]
        plot:
          type: [string, "null"]
          examples: [A linguist works with the military to talk to aliens.]
        studio:
          type: [string, "null"]
          examples: [Paramount]
        originalTitle:
          description: The title in the movie's original language. The apps show it only when it differs from the title.
          type: [string, "null"]
          examples: [Arrival]
        directors:
          type: array
          items:
            type: string
          examples: [[Denis Villeneuve]]
        mediaFileId:
          description: The media file the movie plays from, for POST /api/playbacks/v1. Null only while library sync has linked no file.
          type: [string, "null"]
          format: uuid
          examples: ["0190f3c4-c2d3-7e4f-8a5b-6c7d8e9f0a1b"]
        cast:
          description: Up to 10 cast members in billing order.
          type: array
          items:
            $ref: "#/components/schemas/CastMember"
          examples: [[{name: Amy Adams, role: Louise Banks}]]
        images:
          $ref: "#/components/schemas/TitleImages"
          examples: [{fanart: null, logo: null}]
        progress:
          description: How far the user got in the movie, from 0 to 1, when they have a resume position. Otherwise null.
          type: [number, "null"]
          minimum: 0
          maximum: 1
          examples: [0.42]
        watched:
          description: Whether the user has watched the movie.
          type: boolean
          examples: [false]
        play:
          $ref: "#/components/schemas/MoviePlay"
          examples: [{resumePosition: null}]
        moreLikeThis:
          description: Up to 20 visible movies and shows that share a genre with the movie, the most shared genres first, then by sort title.
          type: array
          items:
            $ref: "#/components/schemas/Tile"
          examples: [[]]
      additionalProperties: false
    CastMember:
      description: An actor and the role they play.
      type: object
      required: [name, role]
      properties:
        name:
          type: string
          examples: [Amy Adams]
        role:
          type: [string, "null"]
          examples: [Louise Banks]
      additionalProperties: false
    TitleImages:
      description: The artwork of a movie or show page. A missing image is null, and the app draws the title instead.
      type: object
      required: [fanart, logo]
      properties:
        fanart:
          description: The backdrop.
          anyOf:
            - $ref: "#/components/schemas/Artwork"
            - type: "null"
        logo:
          description: The clearlogo.
          anyOf:
            - $ref: "#/components/schemas/Artwork"
            - type: "null"
      additionalProperties: false
    MoviePlay:
      description: What the movie's Play button plays. The web app plays a movie at /play/movies/{movieId}.
      type: object
      required: [resumePosition]
      properties:
        resumePosition:
          description: The user's resume position in seconds. With one, the page offers Resume and Start over. Otherwise it offers Play from the start.
          type: [number, "null"]
          minimum: 0
          examples: [1534.2]
      additionalProperties: false
    ShowPage:
      description: Everything the show page shows.
      type: object
      required: [id, title, year, certification, status, network, seasonCount, genres, rating, plot, cast, images, seasons, play, moreLikeThis]
      properties:
        id:
          type: string
          format: uuid
          examples: ["0190f3c4-6c7d-7e8f-9a0b-1c2d3e4f5a6b"]
        title:
          type: string
          examples: [Severance]
        year:
          description: The year the show first aired, from Sonarr.
          type: [integer, "null"]
          examples: [2022]
        certification:
          description: The age rating from the show's NFO file.
          type: [string, "null"]
          examples: [TV-MA]
        status:
          description: Whether the show is still airing, from the NFO file, such as Continuing or Ended.
          type: [string, "null"]
          examples: [Continuing]
        network:
          type: [string, "null"]
          examples: [Apple TV+]
        seasonCount:
          description: The number of numbered seasons with a visible episode. Specials don't count.
          type: integer
          minimum: 0
          examples: [2]
        genres:
          type: array
          items:
            type: string
          examples: [[Drama, Mystery]]
        rating:
          description: The rating from the NFO file, from 0 to 10.
          type: [number, "null"]
          examples: [8.7]
        plot:
          type: [string, "null"]
          examples: [Office workers have their memories split.]
        cast:
          description: Up to 10 members of the show's cast in billing order.
          type: array
          items:
            $ref: "#/components/schemas/CastMember"
          examples: [[{name: Adam Scott, role: Mark Scout}]]
        images:
          $ref: "#/components/schemas/TitleImages"
          examples: [{fanart: null, logo: null}]
        seasons:
          description: The seasons with a visible episode, numbered seasons first and Specials last.
          type: array
          items:
            $ref: "#/components/schemas/ShowSeason"
          examples: [[{id: "0190f3c4-7d8e-7f90-a1b2-c3d4e5f6a7b8", number: 1, name: Season 1, episodeCount: 9}]]
        play:
          $ref: "#/components/schemas/ShowPlay"
        moreLikeThis:
          description: Up to 20 movies and shows that share a genre with the show, most shared genres first.
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/Tile"
          examples: [[]]
      additionalProperties: false
    ShowSeason:
      description: A season of the show page's season list.
      type: object
      required: [id, number, name, episodeCount]
      properties:
        id:
          type: string
          format: uuid
          examples: ["0190f3c4-7d8e-7f90-a1b2-c3d4e5f6a7b8"]
        number:
          description: The number of the season. Specials are 0.
          type: integer
          minimum: 0
          examples: [1]
        name:
          description: The name the apps show, such as Season 1 or Specials.
          type: string
          examples: [Season 1]
        episodeCount:
          description: The number of visible episodes in the season.
          type: integer
          minimum: 1
          examples: [9]
      additionalProperties: false
    ShowPlayVerb:
      description: What the show's Play button does. The apps label it with the verb and the episode, such as "Play S1:E1" or "Resume S2:E4".
      type: string
      enum: [play, resume]
      examples: [play]
    ShowPlay:
      description: The episode the show's Play button plays, and the season the show page opens on. The web app plays an episode at /play/episodes/{episodeId}.
      type: object
      required: [verb, resumePosition, season, episode]
      properties:
        verb:
          $ref: "#/components/schemas/ShowPlayVerb"
        resumePosition:
          description: The user's resume position in the episode in seconds when the verb is resume. Otherwise null.
          type: [number, "null"]
          minimum: 0
          examples: [1534.2]
        season:
          $ref: "#/components/schemas/ShowPlaySeason"
        episode:
          $ref: "#/components/schemas/ShowPlayEpisode"
      additionalProperties: false
    ShowPlaySeason:
      description: The season of the episode Play plays.
      type: object
      required: [id, number]
      properties:
        id:
          type: string
          format: uuid
          examples: ["0190f3c4-7d8e-7f90-a1b2-c3d4e5f6a7b8"]
        number:
          type: integer
          minimum: 0
          examples: [1]
      additionalProperties: false
    ShowPlayEpisode:
      description: The episode Play plays.
      type: object
      required: [id, number, title, mediaFileId]
      properties:
        id:
          type: string
          format: uuid
          examples: ["0190f3c4-ab1c-7d2e-8f3a-4b5c6d7e8f9a"]
        number:
          type: integer
          examples: [1]
        title:
          type: string
          examples: [Good News About Hell]
        mediaFileId:
          description: The media file the episode plays from, for POST /api/playbacks/v1. Null only while library sync has linked no file.
          type: [string, "null"]
          format: uuid
          examples: ["0190f3c4-c2d3-7e4f-8a5b-6c7d8e9f0a1b"]
      additionalProperties: false
    EpisodeList:
      description: The visible episodes of one season.
      type: object
      required: [episodes]
      properties:
        episodes:
          type: array
          items:
            $ref: "#/components/schemas/EpisodeListItem"
          examples:
            - [{"id":"0190f3c4-ab1c-7d2e-8f3a-4b5c6d7e8f9a","number":1,"title":"Good News About Hell","runtimeMinutes":57,"plot":"Mark leads a team of office workers.","thumb":null,"mediaFileId":"0190f3c4-c2d3-7e4f-8a5b-6c7d8e9f0a1b","progress":null,"watched":false}]
      additionalProperties: false
    EpisodeListItem:
      description: One episode of a season's episode list.
      type: object
      required: [id, number, title, runtimeMinutes, plot, thumb, mediaFileId, progress, watched]
      properties:
        id:
          type: string
          format: uuid
          examples: ["0190f3c4-ab1c-7d2e-8f3a-4b5c6d7e8f9a"]
        number:
          type: integer
          examples: [1]
        title:
          type: string
          examples: [Good News About Hell]
        runtimeMinutes:
          description: The length of the episode's media file, from probing it. A media file that holds two episodes gives both its whole length. Null until the file is probed.
          type: [integer, "null"]
          examples: [57]
        plot:
          type: [string, "null"]
          examples: [Mark leads a team of office workers.]
        thumb:
          description: The episode's thumb. A missing thumb is null, and the app draws a placeholder.
          anyOf:
            - $ref: "#/components/schemas/Artwork"
            - type: "null"
        mediaFileId:
          description: The media file the episode plays from, for POST /api/playbacks/v1. The episodes of a file that holds two share its ID. Null only while library sync has linked no file.
          type: [string, "null"]
          format: uuid
          examples: ["0190f3c4-c2d3-7e4f-8a5b-6c7d8e9f0a1b"]
        progress:
          description: How far the user got in the episode, from 0 to 1, when they have a resume position. Otherwise null.
          type: [number, "null"]
          minimum: 0
          maximum: 1
          examples: [0.42]
        watched:
          description: Whether the user has watched the episode.
          type: boolean
          examples: [false]
      additionalProperties: false
    EpisodePage:
      description: Everything the episode page shows.
      type: object
      required: [id, title, seasonNumber, episodeNumber, airDate, runtimeMinutes, rating, plot, thumb, show, audioLanguages, subtitleLanguages, mediaFileId, progress, watched, play]
      properties:
        id:
          type: string
          format: uuid
          examples: ["0190f3c4-ab1c-7d2e-8f3a-4b5c6d7e8f9a"]
        title:
          type: string
          examples: [Half Loop]
        seasonNumber:
          description: The season number. Specials are 0.
          type: integer
          minimum: 0
          examples: [1]
        episodeNumber:
          type: integer
          examples: [2]
        airDate:
          description: The day the episode first aired.
          type: [string, "null"]
          format: date
          examples: ["2022-02-18"]
        runtimeMinutes:
          description: The length of the episode's media file, from probing it. A media file that holds two episodes gives both its whole length. Null until the file is probed.
          type: [integer, "null"]
          examples: [57]
        rating:
          description: The rating from the episode's metadata, from 0 to 10.
          type: [number, "null"]
          examples: [8.1]
        plot:
          type: [string, "null"]
          examples: [Mark takes Helly to the break room.]
        thumb:
          description: The episode's thumb, the page's backdrop. A missing thumb is null, and the app draws a placeholder.
          anyOf:
            - $ref: "#/components/schemas/Artwork"
            - type: "null"
          examples: [null]
        show:
          $ref: "#/components/schemas/EpisodeShow"
        audioLanguages:
          description: The languages of the file's audio streams in stream order, each once, as the file tags them (ISO 639-2, such as eng). Untagged streams are left out.
          type: array
          items:
            type: string
          examples: [[eng, jpn]]
        subtitleLanguages:
          description: The text subtitles in the file in stream order, then the subtitle files beside it by file name, each language and flag pair once. Image subtitles, such as PGS, are left out, and so are subtitles with no language. Streams carry ISO 639-2 codes, such as eng, and subtitle files the code in their name, such as en.
          type: array
          items:
            $ref: "#/components/schemas/SubtitleLanguage"
          examples: [[{language: eng, hearingImpaired: false, forced: true}]]
        mediaFileId:
          description: The media file the episode plays from, for POST /api/playbacks/v1. The episodes of a file that holds two share its ID. Null only while library sync has linked no file.
          type: [string, "null"]
          format: uuid
          examples: ["0190f3c4-c2d3-7e4f-8a5b-6c7d8e9f0a1b"]
        progress:
          description: How far the user got in the episode, from 0 to 1, when they have a resume position. Otherwise null.
          type: [number, "null"]
          minimum: 0
          maximum: 1
          examples: [0.42]
        watched:
          description: Whether the user has watched the episode.
          type: boolean
          examples: [false]
        play:
          $ref: "#/components/schemas/EpisodePlay"
      additionalProperties: false
    EpisodeShow:
      description: The show an episode belongs to.
      type: object
      required: [id, title, logo]
      properties:
        id:
          type: string
          format: uuid
          examples: ["0190f3c4-6c7d-7e8f-9a0b-1c2d3e4f5a6b"]
        title:
          type: string
          examples: [Severance]
        logo:
          description: The show's clearlogo. A missing logo is null, and the app draws the show's title instead.
          anyOf:
            - $ref: "#/components/schemas/Artwork"
            - type: "null"
      additionalProperties: false
    SubtitleLanguage:
      description: One subtitle language of an episode.
      type: object
      required: [language, hearingImpaired, forced]
      properties:
        language:
          type: string
          examples: [eng]
        hearingImpaired:
          description: Whether the subtitles are for the deaf and hard of hearing (SDH).
          type: boolean
          examples: [false]
        forced:
          description: Whether the subtitles cover only foreign or hard to hear lines.
          type: boolean
          examples: [true]
      additionalProperties: false
    EpisodePlay:
      description: What the episode's Play button plays. The web app plays an episode at /play/episodes/{episodeId}.
      type: object
      required: [resumePosition]
      properties:
        resumePosition:
          description: The user's resume position in seconds. With one, the page offers Resume and Start over. Otherwise it offers Play from the start.
          type: [number, "null"]
          minimum: 0
          examples: [1534.2]
      additionalProperties: false
    GenreKind:
      description: The kind of title a genre list counts.
      type: string
      enum: [movie, show]
      examples: [movie]
    GenreList:
      description: The genres of one kind of title.
      type: object
      required: [genres]
      properties:
        genres:
          type: array
          items:
            $ref: "#/components/schemas/Genre"
          examples:
            - [{"name":"Drama","count":2},{"name":"Science Fiction","count":1}]
      additionalProperties: false
    Genre:
      description: A genre and the number of visible titles in it.
      type: object
      required: [name, count]
      properties:
        name:
          type: string
          examples: [Drama]
        count:
          type: integer
          minimum: 1
          examples: [2]
      additionalProperties: false
    Home:
      description: What Home shows.
      type: object
      required: [featured, rows]
      properties:
        featured:
          description: The featured title, or null when no title has a release date.
          anyOf:
            - $ref: "#/components/schemas/FeaturedTitle"
            - type: "null"
          examples: [null]
        rows:
          type: array
          items:
            $ref: "#/components/schemas/HomeRow"
          examples:
            - [{"kind":"genre","genre":"Drama","tiles":[]}]
      additionalProperties: false
    FeaturedTitle:
      description: The one movie or show shown large at the top of Home. Its fanart comes at the backdrop widths too.
      type: object
      required: [tile, playEpisodeId]
      properties:
        tile:
          $ref: "#/components/schemas/Tile"
        playEpisodeId:
          description: The episode Play starts for a show. It is null for a movie, whose Play starts the movie.
          type: [string, "null"]
          format: uuid
          examples: ["0190f3c4-9a0b-7c1d-8e2f-3a4b5c6d7e8f"]
      additionalProperties: false
    HomeRowKind:
      description: Which row of Home this is.
      type: string
      enum: [continueWatching, recentlyAdded, popularNow, genre]
      examples: [recentlyAdded]
    HomeRow:
      description: One row of Home.
      type: object
      required: [kind, genre, tiles]
      properties:
        kind:
          $ref: "#/components/schemas/HomeRowKind"
        genre:
          description: The genre of a genre row. It is null for the other rows.
          type: [string, "null"]
          examples: [Drama]
        tiles:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/Tile"
      additionalProperties: false
    StartPlaybackRequest:
      description: The media file to play, where to start, and what the device plays.
      type: object
      required: [mediaFileId, startPosition, profile]
      properties:
        mediaFileId:
          description: The mediaFileId of the movie or episode.
          type: string
          format: uuid
          examples: ["0190f3c4-c2d3-7e4f-8a5b-6c7d8e9f0a1b"]
        startPosition:
          description: Where to start, in seconds.
          type: number
          minimum: 0
          examples: [1534.2]
        profile:
          $ref: "#/components/schemas/CapabilityProfile"
        forceHls:
          description: Play through HLS even when the device could play the file directly. The player sets it to retry after a direct play fails.
          type: boolean
          default: false
          examples: [false]
    CapabilityProfile:
      description: What the device plays without server work. Names are ffprobe's, in lower case.
      type: object
      required: [containers, videoCodecs, audioCodecs, subtitleCodecs]
      properties:
        containers:
          description: The containers the device plays directly, from mkv, webm, mp4 and mov.
          type: array
          items:
            type: string
          examples: [[mp4, webm]]
        videoCodecs:
          type: array
          items:
            $ref: "#/components/schemas/VideoCodecSupport"
        audioCodecs:
          description: The audio codecs the device decodes or passes through.
          type: array
          items:
            $ref: "#/components/schemas/AudioCodecSupport"
        subtitleCodecs:
          description: The subtitle codecs the device shows when they are embedded in a direct play, such as subrip or hdmv_pgs_subtitle.
          type: array
          items:
            type: string
          examples: [[]]
    VideoCodecSupport:
      description: One video codec the device decodes.
      type: object
      required: [codec, profiles, maxWidth, maxHeight, hdrTypes]
      properties:
        codec:
          description: The codec, such as h264, hevc, av1 or vp9.
          type: string
          examples: [h264]
        profiles:
          description: The profiles the device decodes, in lower case without spaces, such as main, high, high10 or main10.
          type: array
          items:
            type: string
          examples: [[main, high]]
        maxWidth:
          type: integer
          minimum: 1
          examples: [3840]
        maxHeight:
          type: integer
          minimum: 1
          examples: [2160]
        hdrTypes:
          description: The dynamic ranges the device shows. Dolby Vision plays as its HDR10 base layer where only hdr10 is listed.
          type: array
          items:
            $ref: "#/components/schemas/HdrType"
          examples: [[sdr]]
    AudioCodecSupport:
      description: One audio codec the device decodes or passes through.
      type: object
      required: [codec, maxChannels]
      properties:
        codec:
          description: The codec, such as aac, ac3, eac3, flac or opus.
          type: string
          examples: [aac]
        maxChannels:
          type: integer
          minimum: 1
          examples: [2]
    HdrType:
      description: A dynamic range.
      type: string
      enum: [sdr, hdr10, hlg, dolbyVision]
      examples: [hdr10]
    ProgressReport:
      description: Where a playback is, and whether it is paused or stopped.
      type: object
      required: [position, paused, stopped]
      properties:
        position:
          description: The position in seconds.
          type: number
          minimum: 0
          examples: [1534.2]
        paused:
          type: boolean
          examples: [false]
        stopped:
          description: Whether the player stopped. A stop report ends the playback.
          type: boolean
          examples: [false]
    Playback:
      description: A playback the server started, with what the player needs to play it.
      type: object
      required: [playbackId, method, reasons, url, duration, movie, episodes, audioTracks, subtitleTracks]
      properties:
        playbackId:
          type: string
          format: uuid
          examples: ["0190f3c4-d3e4-7f5a-8b6c-7d8e9f0a1b2c"]
        method:
          $ref: "#/components/schemas/PlayMethod"
        reasons:
          description: Why the playback is not a direct play. It is empty for a direct play.
          type: array
          items:
            $ref: "#/components/schemas/PlayReason"
          examples: [[]]
        url:
          description: The signed URL the player plays, the media file for a direct play and the HLS master playlist main.m3u8 otherwise. It needs no Authorization header.
          type: string
          format: uri-reference
          examples: ["/api/playbacks/0190f3c4-d3e4-7f5a-8b6c-7d8e9f0a1b2c/media/Jm2vX8kQ0rH3c1yF5bR7tVw9nL4pA6sD0eG2iK8uO1M/v1/file"]
        duration:
          description: The length of the media file in seconds, or null when probing it gave none.
          type: [number, "null"]
          minimum: 0
          examples: [6981.0]
        movie:
          description: The movie the media file holds, or null for episodes.
          anyOf:
            - $ref: "#/components/schemas/PlaybackMovie"
            - type: "null"
          examples: [{id: "0190f3c4-5b6a-7c8d-9e0f-1a2b3c4d5e6f", title: Arrival}]
        episodes:
          description: The visible episodes the media file holds, in order. It is empty for a movie.
          type: array
          items:
            $ref: "#/components/schemas/PlaybackEpisode"
          examples: [[]]
        audioTracks:
          description: Every audio track of the media file, in stream order.
          type: array
          items:
            $ref: "#/components/schemas/PlaybackAudioTrack"
          examples: [[{id: "0190f3c4-e4f5-7a6b-8c7d-8e9f0a1b2c3d", language: eng, label: Stereo, codec: aac, channels: 2, default: true, inStream: true}]]
        subtitleTracks:
          description: Every subtitle in the media file in stream order, then the subtitle files beside it by file name.
          type: array
          items:
            $ref: "#/components/schemas/PlaybackSubtitleTrack"
          examples: [[]]
      additionalProperties: false
    PlayMethod:
      description: How the media file plays.
      type: string
      enum: [directPlay, remux, transcode]
      examples: [directPlay]
    PlayReason:
      description: One reason a playback is not a direct play.
      type: object
      required: [kind, value]
      properties:
        kind:
          type: string
          enum: [container, videoCodec, videoProfile, videoSize, videoRange, audioCodec, audioChannels, noKeyframeIndex, forcedHls]
          examples: [audioCodec]
        value:
          description: The media file's value the profile doesn't cover, such as dts, 3840x2160, hdr10 or 6. It is null for noKeyframeIndex and forcedHls.
          type: [string, "null"]
          examples: [dts]
      additionalProperties: false
    PlaybackMovie:
      description: The movie a playback plays.
      type: object
      required: [id, title]
      properties:
        id:
          type: string
          format: uuid
          examples: ["0190f3c4-5b6a-7c8d-9e0f-1a2b3c4d5e6f"]
        title:
          type: string
          examples: [Arrival]
      additionalProperties: false
    PlaybackEpisode:
      description: An episode a playback plays.
      type: object
      required: [id, showTitle, seasonNumber, episodeNumber, title]
      properties:
        id:
          type: string
          format: uuid
          examples: ["0190f3c4-ab1c-7d2e-8f3a-4b5c6d7e8f9a"]
        showTitle:
          type: string
          examples: [Severance]
        seasonNumber:
          description: The season number. Specials are 0.
          type: integer
          minimum: 0
          examples: [1]
        episodeNumber:
          type: integer
          examples: [2]
        title:
          type: string
          examples: [Half Loop]
      additionalProperties: false
    PlaybackAudioTrack:
      description: One audio track of a playback.
      type: object
      required: [id, language, label, codec, channels, default, inStream]
      properties:
        id:
          type: string
          format: uuid
          examples: ["0190f3c4-e4f5-7a6b-8c7d-8e9f0a1b2c3d"]
        language:
          description: The language the file tags the track with (ISO 639-2, such as eng), or null.
          type: [string, "null"]
          examples: [eng]
        label:
          description: The track's title from the file, or null.
          type: [string, "null"]
          examples: [Surround 5.1]
        codec:
          type: string
          examples: [aac]
        channels:
          type: integer
          minimum: 1
          examples: [2]
        default:
          description: Whether the file marks the track as its default.
          type: boolean
          examples: [true]
        inStream:
          description: Whether the stream the player plays carries the track, so the player can switch to it in place.
          type: boolean
          examples: [true]
      additionalProperties: false
    PlaybackSubtitleTrack:
      description: One subtitle track of a playback.
      type: object
      required: [id, language, label, codec, default, forced, hearingImpaired, external, text, inStream]
      properties:
        id:
          type: string
          format: uuid
          examples: ["0190f3c4-f5a6-7b7c-8d8e-9f0a1b2c3d4e"]
        language:
          description: The language of the track, an ISO 639-2 code for a stream, such as eng, and the code in the name of a subtitle file, such as en. Null when there is none.
          type: [string, "null"]
          examples: [eng]
        label:
          description: The track's title from the file, or null. Subtitle files have none.
          type: [string, "null"]
          examples: [English SDH]
        codec:
          description: The codec of a stream, such as subrip or hdmv_pgs_subtitle, or the extension of a subtitle file, such as srt.
          type: string
          examples: [subrip]
        default:
          type: boolean
          examples: [false]
        forced:
          description: Whether the subtitles cover only foreign or hard to hear lines.
          type: boolean
          examples: [false]
        hearingImpaired:
          description: Whether the subtitles are for the deaf and hard of hearing (SDH).
          type: boolean
          examples: [true]
        external:
          description: Whether the track is a subtitle file beside the media file.
          type: boolean
          examples: [false]
        text:
          description: Whether the subtitles are text. Image subtitles, such as PGS, are not.
          type: boolean
          examples: [true]
        inStream:
          description: Whether the stream the player plays carries the track and the device shows it. An HLS stream carries every text subtitle as WebVTT and no image subtitle.
          type: boolean
          examples: [false]
      additionalProperties: false
    MediaFileBytes:
      description: The bytes of the media file, or of the requested range.
      type: string
      contentMediaType: application/octet-stream
    HlsPlaylist:
      description: An HLS playlist with relative URLs.
      type: string
      contentMediaType: application/vnd.apple.mpegurl
    HlsSegmentBytes:
      description: The fMP4 init segment or a media segment.
      type: string
      contentMediaType: video/mp4
    WebVtt:
      description: WebVTT subtitles, whose X-TIMESTAMP-MAP puts their times on the video's timeline.
      type: string
      contentMediaType: text/vtt
