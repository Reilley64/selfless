[tools]
actionlint = "1.7.12"
bun = "1.4.4"
cargo-deny = "0.20.2"
node = "26.13.0"
vacuum = "0.35.7"
"github:open-telemetry/weaver" = "0.28.0"

[env]
DATABASE__URL = "postgres://selfless:selfless@localhost:5432/selfless"
OTEL_SERVICE_NAME = "selfless"

[tasks.services]
description = "Start PostgreSQL and grafana/otel-lgtm for local development"
run = "docker compose up --detach --wait"

[tasks.generate]
description = "Generate the API client, the TypeScript telemetry constants and the theme"
run = "bun run generate"

[tasks.dev]
description = "Start the server and the web app against the local services"
depends = ["dev:server", "dev:web"]

[tasks."dev:server"]
description = "Start the server"
depends = ["services"]
run = "cargo run"

[tasks."dev:web"]
description = "Start the web app's dev server, which proxies API calls to the server"
depends = ["generate"]
dir = "presentation/web"
run = "bun run start"

[tasks.check]
description = "Check formatting, lints and crate direction"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets --all-features -- -D warnings",
  "cargo deny check bans",
]

[tasks.test]
description = "Run the server tests against the local PostgreSQL"
depends = ["services"]
run = "cargo test --workspace"

[tasks."lint:openapi"]
description = "Lint the OpenAPI file"
run = "vacuum lint --details openapi.yaml"

[tasks."lint:telemetry"]
description = "Check the Weaver registry"
run = "weaver registry check --future --registry telemetry/registry"

[tasks."lint:workflows"]
description = "Lint the GitHub workflows"
run = "actionlint"
