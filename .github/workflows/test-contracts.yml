name: "Test: Contracts"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-contracts-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-openapi:
    name: "Test: OpenAPI contract"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "Source: Check out the repository"
        uses: actions/checkout@v7

      - name: "Setup: Install the tools from mise.toml"
        uses: jdx/mise-action@v5
        with:
          install_args: vacuum

      - name: "Scan: Lint the OpenAPI file"
        run: vacuum lint --details openapi.yaml

  test-telemetry:
    name: "Test: Telemetry registry"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "Source: Check out the repository"
        uses: actions/checkout@v7

      - name: "Setup: Install the tools from mise.toml"
        uses: jdx/mise-action@v5
        with:
          install_args: github:open-telemetry/weaver

      - name: "Scan: Check the Weaver registry"
        run: weaver registry check --future --diagnostic-format gh_workflow_command --registry telemetry/registry

  test-workflows:
    name: "Test: GitHub workflows"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "Source: Check out the repository"
        uses: actions/checkout@v7

      - name: "Setup: Install the tools from mise.toml"
        uses: jdx/mise-action@v5
        with:
          install_args: actionlint

      - name: "Scan: Lint the GitHub workflows"
        run: mise run lint:workflows
