name: "Build and test: Server"

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: build-test-server-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  build-test:
    name: "Build and test: Server"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: selfless
          POSTGRES_PASSWORD: selfless
          POSTGRES_DB: selfless
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username selfless"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    steps:
      - name: "Source: Check out the repository"
        uses: actions/checkout@v7

      - name: "Setup: Install the tools from mise.toml"
        uses: jdx/mise-action@v5
        with:
          install_args: bun cargo-deny github:open-telemetry/weaver

      - name: "Setup: Install the Rust toolchain from rust-toolchain.toml"
        run: rustup toolchain install

      - name: "Setup: Restore the Rust cache"
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: "Setup: Install the workspace dependencies"
        run: bun install --frozen-lockfile

      - name: "Build: Generate the theme for the admin app"
        run: bun run generate

      - name: "Scan: Check Rust formatting"
        run: cargo fmt --all --check

      - name: "Scan: Run Clippy"
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: "Scan: Check crate direction and banned crates"
        run: cargo deny check bans

      - name: "Build: Compile the Rust workspace"
        run: cargo build --locked --workspace --all-targets --all-features

      - name: "Test: Run the server tests against PostgreSQL"
        run: cargo test --locked --workspace --all-features
