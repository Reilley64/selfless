name: "Test: Pull request policy"

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  test-policy:
    name: "Test: Pull request policy"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "Policy: Enforce a conventional commit title"
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            style
            test
            build
            ci
            chore
            revert
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-comments:
    name: "Test: New comments"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: "Source: Check out the repository with the base branch"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "Policy: Reject lines that add a comment"
        env:
          BASE_REF: ${{ github.base_ref }}
        run: scripts/check-no-new-comments "origin/$BASE_REF"
