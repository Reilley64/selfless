name: "Test: Pull request policy"

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  test-policy:
    name: "Test: Pull request policy"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "Policy: Enforce a conventional commit title"
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            style
            test
            build
            ci
            chore
            revert
