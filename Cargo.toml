[workspace]
resolver = "3"
members = [
    "application",
    "domain",
    "infrastructure/dependencies",
    "infrastructure/persistence",
    "infrastructure/settings",
    "infrastructure/telemetry",
    "presentation/admin",
    "presentation/api",
    "presentation/webhooks",
    "presentation/workers",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
config = { version = "0.15.27", default-features = false }
fundle = "0.4.1"
jsonschema = { version = "0.60.2", default-features = false }
ohno = "0.5.3"
reqwest = { version = "0.13.5", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.0.0"
serde_json = "1.0.154"
toasty = { version = "0.11.0", default-features = false, features = ["migration"] }
toasty-cli = "0.11.0"
toasty-driver-postgresql = { version = "0.11.0", default-features = false, features = ["tls"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-postgres = "0.7.18"
tokio-util = "0.7.20"
topcoat = "0.11.0"
url = "2.5.8"

application = { path = "application" }
domain = { path = "domain" }
infrastructure = { path = "infrastructure/dependencies" }
persistence = { path = "infrastructure/persistence" }
settings = { path = "infrastructure/settings" }
telemetry = { path = "infrastructure/telemetry" }
admin = { path = "presentation/admin" }
api = { path = "presentation/api" }
webhooks = { path = "presentation/webhooks" }
workers = { path = "presentation/workers" }

[package]
name = "selfless"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
default-run = "selfless"

[dependencies]
admin = { workspace = true }
api = { workspace = true }
application = { workspace = true }
infrastructure = { workspace = true }
ohno = { workspace = true, features = ["app-err"] }
settings = { workspace = true }
toasty-cli = { workspace = true }
tokio = { workspace = true }
topcoat = { workspace = true }
webhooks = { workspace = true }
workers = { workspace = true }

[dev-dependencies]
jsonschema = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
serde-saphyr = { workspace = true }
serde_json = { workspace = true }
tokio-postgres = { workspace = true }
tokio-util = { workspace = true }
url = { workspace = true }
